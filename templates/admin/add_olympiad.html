{% extends 'admin/base.html' %}
{% block title %}Olimpiad Qo'shish{% endblock %}
{% block breadcrumb %} / <a href="{{ url_for('admin_olympiads') }}">Olimpiadalar</a> / Qo'shish{% endblock %}
{% block content %}
<div class="page-title">
    <h1><i class="fas fa-plus-circle"></i> Olimpiad Qo'shish</h1>
</div>
<div class="admin-card form-card">
    <form method="POST" class="admin-form">
        <div class="form-row">
            <div class="form-group">
                <label>Olimpiad nomi *</label>
                <input type="text" name="title" required placeholder="Olimpiad nomini kiriting">
            </div>
            <div class="form-group">
                <label>Fan *</label>
                <select name="subject" required>
                    <option value="">Fanni tanlang</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Fizika">Fizika</option>
                    <option value="Kimyo">Kimyo</option>
                    <option value="Biologiya">Biologiya</option>
                    <option value="Informatika">Informatika</option>
                    <option value="Ingliz tili">Ingliz tili</option>
                    <option value="Tarix">Tarix</option>
                    <option value="Geografiya">Geografiya</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Daraja *</label>
                <select name="level" required>
                    <option value="">Darajani tanlang</option>
                    <option value="Maktab">Maktab</option>
                    <option value="Tuman">Tuman</option>
                    <option value="Viloyat">Viloyat</option>
                    <option value="Respublika">Respublika</option>
                    <option value="Xalqaro">Xalqaro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Holat *</label>
                <select name="status" required>
                    <option value="upcoming">Kutilmoqda</option>
                    <option value="active">Faol</option>
                    <option value="finished">Tugagan</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Olimpiad sanasi *</label>
                <input type="date" name="date" required>
            </div>
            <div class="form-group">
                <label>Ro'yxat muddati *</label>
                <input type="date" name="deadline" required>
            </div>
        </div>
        <div class="form-group">
            <label>Tavsif *</label>
            <textarea name="description" rows="4" required placeholder="Olimpiad haqida ma'lumot kiriting"></textarea>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('admin_olympiads') }}" class="btn btn-outline">Bekor qilish</a>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Saqlash</button>
        </div>
    </form>
</div>
{% endblock %}
