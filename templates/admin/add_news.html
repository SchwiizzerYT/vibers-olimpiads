{% extends 'admin/base.html' %}
{% block title %}Yangilik Qo'shish{% endblock %}
{% block breadcrumb %} / <a href="{{ url_for('admin_news') }}">Yangiliklar</a> / Qo'shish{% endblock %}
{% block content %}
<div class="page-title">
    <h1><i class="fas fa-newspaper"></i> Yangilik Qo'shish</h1>
</div>
<div class="admin-card form-card">
    <form method="POST" class="admin-form">
        <div class="form-group">
            <label>Sarlavha *</label>
            <input type="text" name="title" required placeholder="Yangilik sarlavhasi">
        </div>
        <div class="form-group">
            <label>Matn *</label>
            <textarea name="content" rows="6" required placeholder="Yangilik matni..."></textarea>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('admin_news') }}" class="btn btn-outline">Bekor qilish</a>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Saqlash</button>
        </div>
    </form>
</div>
{% endblock %}
