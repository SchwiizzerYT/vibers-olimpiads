{% extends 'admin/base.html' %}
{% block title %}Natija Qo'shish{% endblock %}
{% block breadcrumb %} / <a href="{{ url_for('admin_results') }}">Natijalar</a> / Qo'shish{% endblock %}
{% block content %}
<div class="page-title">
    <h1><i class="fas fa-trophy"></i> Natija Qo'shish</h1>
</div>
<div class="admin-card form-card">
    <form method="POST" class="admin-form">
        <div class="form-row">
            <div class="form-group">
                <label>Ishtirokchi ismi *</label>
                <input type="text" name="participant_name" required placeholder="To'liq ism">
            </div>
            <div class="form-group">
                <label>Maktab *</label>
                <input type="text" name="school" required placeholder="Maktab nomi">
            </div>
        </div>
        <div class="form-group">
            <label>Olimpiad *</label>
            <select name="olympiad_id" required>
                <option value="">Olimpiadni tanlang</option>
                {% for o in olympiads %}
                <option value="{{ o.id }}">{{ o.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>O'rin *</label>
                <input type="number" name="place" min="1" required placeholder="O'rin raqami">
            </div>
            <div class="form-group">
                <label>Ball *</label>
                <input type="number" name="score" step="0.1" min="0" required placeholder="Ball">
            </div>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('admin_results') }}" class="btn btn-outline">Bekor qilish</a>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Saqlash</button>
        </div>
    </form>
</div>
{% endblock %}
